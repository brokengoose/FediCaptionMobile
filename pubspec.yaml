# FediCaption Mobile (iOS & Android)
# Contributor: brokengoose <brokengoose@users.noreply.github.com>
# License: MIT

name: fedicaption_mobile
description: An accessible mobile Mastodon client with automatic AI alt-text generation and pre-post racial & gender bias checking.
publish_to: 'none'
version: 1.0.0+1
homepage: https://github.com/brokengoose/FediCaptionMobile
repository: https://github.com/brokengoose/FediCaptionMobile
issue_tracker: https://github.com/brokengoose/FediCaptionMobile/issues

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  flutter_web_auth_2: ^6.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^13.4.0
  flutter_tts: ^4.2.0
  edge_gen_ai: ^0.4.0
  google_mlkit_translation: ^0.13.0
  get_thumbnail_video: ^0.7.3
  video_player: ^2.9.2
  video_player_win: ^3.1.0
  video_player_media_kit: ^2.0.0
  media_kit_libs_linux: ^1.2.1
  html: ^0.15.4
  image: ^4.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
