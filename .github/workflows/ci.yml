name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the tag-only `release` job can write.
permissions:
  contents: read

# A newer push to the same PR supersedes the running one. Pushes to main and
# tags always run to completion so every commit/release gets its artifacts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.flutter-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .flutter-version is the single source of truth for the CI toolchain.
      - name: Read pinned Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "${GITHUB_OUTPUT}"

      - name: Set up Flutter ${{ steps.flutter-version.outputs.version }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check app versions match (VERSION, pubspec, AppConstants, tag)
        run: scripts/check_versions.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Check generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated || {
            echo "::error::lib/l10n/generated is stale. Run 'flutter gen-l10n' and commit the result."
            exit 1
          }

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

  linux:
    name: Linux
    needs: verify
    uses: ./.github/workflows/linux-build.yml
    with:
      flutter-version: ${{ needs.verify.outputs.flutter-version }}

  windows:
    name: Windows
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    with:
      flutter-version: ${{ needs.verify.outputs.flutter-version }}

  # Compile-only checks for the mobile and macOS targets (no signing, no
  # artifacts) so platform regressions surface on the PR that causes them.
  android:
    name: Android build check
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter ${{ needs.verify.outputs.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.verify.outputs.flutter-version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

  apple:
    name: iOS & macOS build check
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ needs.verify.outputs.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.verify.outputs.flutter-version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (debug, no code signing)
        run: flutter build ios --debug --no-codesign

      - name: Build macOS (debug)
        run: flutter build macos --debug

  release:
    name: Attach desktop builds to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FediCaption-*
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ls -lh dist
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            echo "No GitHub Release exists yet for ${TAG}; artifacts are available on the workflow run."
          fi
