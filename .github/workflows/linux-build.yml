name: Build Linux Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libmpv-dev mpv libepoxy-dev

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package portable Linux x64 .tar.gz and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [[ ! -x "${BUNDLE_DIR}/fedicaption" ]]; then
            echo "Expected ${BUNDLE_DIR}/fedicaption executable not found" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            TAG="${VERSION}-${GITHUB_SHA:0:7}"
          fi

          OUT_DIR="dist"
          STAGE_DIR="${OUT_DIR}/FediCaption"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"

          cp -a "${BUNDLE_DIR}/." "${STAGE_DIR}/"
          cp "linux/packaging/fedicaption.desktop" "${STAGE_DIR}/"
          install -m 755 "linux/packaging/install-desktop-entry.sh" "${STAGE_DIR}/install-desktop-entry.sh"

          cat > "${STAGE_DIR}/README-LINUX.txt" <<'EOF'
          FediCaption for Linux (x64 Portable Bundle)
          ===========================================

          Quick Start
          -----------
          1. Extract the FediCaption folder anywhere you like.
          2. Run from a terminal:
               ./fedicaption
          3. (Optional) Add FediCaption and its icon to your desktop app launcher:
               ./install-desktop-entry.sh

          Recommended System Runtime Packages
          -----------------------------------
          - Embedded video & GIFV playback: libmpv / mpv
              Ubuntu/Debian: sudo apt install libmpv2 mpv
              Fedora:        sudo dnf install mpv-libs
              Arch:          sudo pacman -S mpv
          - Read-aloud alt-text (TTS): Speech Dispatcher or eSpeak NG
              Ubuntu/Debian: sudo apt install speech-dispatcher espeak-ng
          - Encrypted credential storage (optional; falls back if absent):
              gnome-keyring or kwallet (org.freedesktop.secrets)
          - WebKit2GTK / libsoup shared library (linked by desktop plugins):
              Ubuntu/Debian: libwebkit2gtk-4.1-0 (pre-installed on GNOME/Ubuntu)
              Fedora:        webkit2gtk4.1
              Arch:          webkit2gtk-4.1
          EOF

          TAR_NAME="FediCaption-${TAG}-linux-x64.tar.gz"
          TAR_PATH="${OUT_DIR}/${TAR_NAME}"
          tar -czf "${TAR_PATH}" -C "${OUT_DIR}" FediCaption

          (cd "${OUT_DIR}" && sha256sum "${TAR_NAME}" > SHA256SUMS-linux.txt)

          echo "TAR_PATH=${TAR_PATH}" >> "${GITHUB_ENV}"
          echo "SUM_PATH=${OUT_DIR}/SHA256SUMS-linux.txt" >> "${GITHUB_ENV}"
          ls -lh "${OUT_DIR}"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FediCaption-linux-x64
          path: |
            ${{ env.TAR_PATH }}
            ${{ env.SUM_PATH }}
          retention-days: 30

      - name: Attach Linux .tar.gz to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TAR_PATH}" "${SUM_PATH}" --clobber
          else
            echo "No GitHub Release exists yet for ${TAG}; artifact is available on the workflow run."
          fi
