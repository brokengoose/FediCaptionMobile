name: Build Linux Desktop

# Reusable: called by ci.yml after the shared verify job (format, analyze,
# tests) passes, so this workflow only builds and packages.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: Exact Flutter SDK version (from .flutter-version)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }} Release Build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libmpv-dev mpv libepoxy-dev

      - name: Set up Flutter ${{ inputs.flutter-version }} (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      # subosito/flutter-action has no Linux ARM64 SDK; use a pinned, cached
      # checkout of the same release tag so every leg builds on one version.
      - name: Restore Flutter ${{ inputs.flutter-version }} (ARM64) cache
        if: matrix.arch == 'arm64'
        id: flutter-arm64-cache
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-arm64-${{ inputs.flutter-version }}

      - name: Set up Flutter ${{ inputs.flutter-version }} (ARM64)
        if: matrix.arch == 'arm64'
        shell: bash
        env:
          FLUTTER_VERSION: ${{ inputs.flutter-version }}
          CACHE_HIT: ${{ steps.flutter-arm64-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" != "true" ]]; then
            git clone -b "${FLUTTER_VERSION}" --depth 1 https://github.com/flutter/flutter.git "${HOME}/flutter"
          fi
          echo "${HOME}/flutter/bin" >> "${GITHUB_PATH}"
          "${HOME}/flutter/bin/flutter" --version
          "${HOME}/flutter/bin/flutter" config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package portable Linux ${{ matrix.arch }} .tar.gz and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          BUNDLE_DIR="build/linux/${ARCH}/release/bundle"
          if [[ ! -x "${BUNDLE_DIR}/fedicaption" ]]; then
            echo "Expected ${BUNDLE_DIR}/fedicaption executable not found" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            TAG="${VERSION}-${GITHUB_SHA:0:7}"
          fi

          OUT_DIR="dist"
          STAGE_DIR="${OUT_DIR}/FediCaption"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"

          cp -a "${BUNDLE_DIR}/." "${STAGE_DIR}/"
          cp "linux/packaging/fedicaption.desktop" "${STAGE_DIR}/"
          install -m 755 "linux/packaging/install-desktop-entry.sh" "${STAGE_DIR}/install-desktop-entry.sh"

          {
            printf 'FediCaption for Linux (%s Portable Bundle)\n' "${ARCH}"
            printf '============================================\n\n'
            sed 's/^          //' <<'EOF'
          Quick Start
          -----------
          1. Install the required system runtime libraries below (in particular
             libmpv, which FediCaption links at startup and will not start without).
          2. Extract the FediCaption folder anywhere you like.
          3. Run from a terminal:
               ./fedicaption
          4. (Optional) Add FediCaption and its icon to your desktop app launcher:
               ./install-desktop-entry.sh

          Required System Runtime Libraries
          ---------------------------------
          FediCaption links these shared libraries at startup and will fail to launch
          with a missing shared library error if they are not installed:

          - libmpv (REQUIRED to launch; used for embedded video & GIFV playback):
              Ubuntu 24.04+ / Debian 12+: sudo apt install libmpv2
              Older Ubuntu / Debian:      sudo apt install libmpv1
              Fedora:                     sudo dnf install mpv-libs
              Arch:                       sudo pacman -S mpv
          - WebKit2GTK / libsoup & desktop runtime libraries (usually pre-installed
            on GNOME/Ubuntu desktops; install if missing on minimal setups):
              Ubuntu/Debian: sudo apt install libwebkit2gtk-4.1-0 libsecret-1-0 libepoxy0 libgtk-3-0
              Fedora:        sudo dnf install webkit2gtk4.1 libsecret libepoxy gtk3
              Arch:          sudo pacman -S webkit2gtk-4.1 libsecret libepoxy gtk3

          Optional System Packages
          ------------------------
          - Read-aloud alt-text (TTS): Speech Dispatcher or eSpeak NG
              Ubuntu/Debian: sudo apt install speech-dispatcher espeak-ng
              Fedora:        sudo dnf install speech-dispatcher espeak-ng
              Arch:          sudo pacman -S speech-dispatcher espeak-ng
          - Encrypted credential storage (optional; falls back automatically if absent):
              gnome-keyring or kwallet (org.freedesktop.secrets)
          EOF
          } > "${STAGE_DIR}/README-LINUX.txt"

          TAR_NAME="FediCaption-${TAG}-linux-${ARCH}.tar.gz"
          TAR_PATH="${OUT_DIR}/${TAR_NAME}"
          SUM_FILE="SHA256SUMS-linux-${ARCH}.txt"
          tar -czf "${TAR_PATH}" -C "${OUT_DIR}" FediCaption

          (cd "${OUT_DIR}" && sha256sum "${TAR_NAME}" > "${SUM_FILE}")

          echo "TAR_PATH=${TAR_PATH}" >> "${GITHUB_ENV}"
          echo "SUM_PATH=${OUT_DIR}/${SUM_FILE}" >> "${GITHUB_ENV}"
          ls -lh "${OUT_DIR}"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FediCaption-linux-${{ matrix.arch }}
          path: |
            ${{ env.TAR_PATH }}
            ${{ env.SUM_PATH }}
          retention-days: 30
