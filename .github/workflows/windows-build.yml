name: Build Windows Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Windows release executable
        run: flutter build windows --release

      - name: Package portable Windows x64 ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$releaseDir\FediCaption.exe")) {
            throw "Expected FediCaption.exe not found in $releaseDir"
          }

          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            (Get-Content VERSION -Raw).Trim() + "-" + $env:GITHUB_SHA.Substring(0, 7)
          }

          $outDir = "dist"
          $stageDir = "$outDir\FediCaption"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -Path "$releaseDir\*" -Destination $stageDir -Recurse -Force

          $zipName = "FediCaption-$tag-windows-x64.zip"
          $zipPath = "$outDir\$zipName"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$outDir\SHA256SUMS-windows.txt" -Encoding ascii

          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          echo "SUM_PATH=$outDir\SHA256SUMS-windows.txt" >> $env:GITHUB_ENV
          Get-ChildItem $outDir

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FediCaption-windows-x64
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SUM_PATH }}
          retention-days: 30

      - name: Attach Windows ZIP to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ZIP_PATH $env:SUM_PATH --clobber
          } else {
            Write-Host "No GitHub Release exists yet for $tag; artifact is available on the workflow run."
          }
