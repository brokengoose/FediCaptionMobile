name: Build Windows Desktop

# Reusable: called by ci.yml after the shared verify job (format, analyze,
# tests) passes, so this workflow only builds and packages.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: Exact Flutter SDK version (from .flutter-version)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }} Release Build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ inputs.flutter-version }} (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      # Pinned, cached checkout of the same release tag for Windows ARM64.
      - name: Restore Flutter ${{ inputs.flutter-version }} (ARM64) cache
        if: matrix.arch == 'arm64'
        id: flutter-arm64-cache
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-arm64-${{ inputs.flutter-version }}

      - name: Set up Flutter ${{ inputs.flutter-version }} (ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          FLUTTER_VERSION: ${{ inputs.flutter-version }}
          CACHE_HIT: ${{ steps.flutter-arm64-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterDir = Join-Path $env:USERPROFILE "flutter"
          if ($env:CACHE_HIT -ne 'true') {
            git clone -b $env:FLUTTER_VERSION --depth 1 https://github.com/flutter/flutter.git $flutterDir
          }
          "$flutterDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$flutterDir\bin\flutter.bat" --version
          & "$flutterDir\bin\flutter.bat" config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release executable
        run: flutter build windows --release

      - name: Package portable Windows ${{ matrix.arch }} ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = "${{ matrix.arch }}"
          $releaseDir = "build\windows\$arch\runner\Release"
          if (-not (Test-Path "$releaseDir\FediCaption.exe")) {
            Get-ChildItem -Path build\windows -Recurse -Depth 2 -ErrorAction SilentlyContinue | Format-Table FullName
            throw "Expected FediCaption.exe not found in $releaseDir"
          }

          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            (Get-Content VERSION -Raw).Trim() + "-" + $env:GITHUB_SHA.Substring(0, 7)
          }

          $outDir = "dist"
          $stageDir = "$outDir\FediCaption"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -Path "$releaseDir\*" -Destination $stageDir -Recurse -Force

          $zipName = "FediCaption-$tag-windows-$arch.zip"
          $zipPath = "$outDir\$zipName"
          $sumName = "SHA256SUMS-windows-$arch.txt"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$outDir\$sumName" -Encoding ascii

          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          echo "SUM_PATH=$outDir\$sumName" >> $env:GITHUB_ENV
          Get-ChildItem $outDir

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FediCaption-windows-${{ matrix.arch }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SUM_PATH }}
          retention-days: 30
